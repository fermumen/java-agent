<!doctype html><html><head><meta charset="utf-8">
<!-- Replays session.bin up to marks[?frame=name] in xterm.js. convertEol mimics Windows,
     where println emits CRLF; on Linux raw mode a bare LF does not return the carriage. -->
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<style>
 @font-face{font-family:'DJMono';src:url('DejaVuSansMono.ttf')} @font-face{font-family:'DJSans';src:url('DejaVuSans.ttf')}
 body{margin:0;background:#11131a;display:flex;justify-content:center;padding:28px;font-family:system-ui}
 .win{border-radius:10px;overflow:hidden;box-shadow:0 18px 50px #0009;background:#1e1f29}
 .bar{height:30px;background:#2a2c38;display:flex;align-items:center;padding:0 12px;gap:8px;color:#9aa0b4;font-size:12px}
 .dot{width:12px;height:12px;border-radius:50%} .t{flex:1;text-align:center;margin-right:52px}
 #term{padding:10px 12px}
</style></head><body>
<div class="win"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="t">java-agent — 92×34</span></div><div id="term"></div></div>
<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script>
(async () => {
  await document.fonts.load('14px DJMono'); await document.fonts.load('14px DJSans', '⠋');
  const meta = await (await fetch('marks.json')).json();
  const bytes = new Uint8Array(await (await fetch('session.bin')).arrayBuffer());
  const frame = new URLSearchParams(location.search).get('frame') || 'done';
  const term = new Terminal({cols: meta.cols, rows: meta.rows, convertEol: true, fontSize: 14,
    fontFamily: 'DJMono, DJSans', cursorBlink: false,
    theme: {background: '#1e1f29', foreground: '#e6e6ea', cyan: '#5fd7ff', green: '#5fd787', red: '#ff6b6b'}});
  term.open(document.getElementById('term'));
  term.write(bytes.slice(0, meta.marks[frame]), () => { document.title = 'ready:' + frame; });
})();
</script></body></html>
