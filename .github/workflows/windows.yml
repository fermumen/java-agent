name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - run: mvn -B clean verify
      - run: mvn -B -f productivity/pom.xml clean verify
      - name: Upload agent distribution
        uses: actions/upload-artifact@v4
        with:
          name: java-agent-windows-java11
          path: |
            target/java-agent.jar
            target/productivity.jar
          if-no-files-found: error
