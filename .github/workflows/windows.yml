name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - run: mvn -B clean verify
      - run: mvn -B -f productivity/pom.xml clean verify
      - name: Shaded jar binds the JDK console API
        shell: pwsh
        run: |
          $doctor = java -jar target/java-agent.jar doctor | Out-String
          Write-Output $doctor
          if ($doctor -notmatch 'console API: JDK jdk\.internal\.le') { throw 'JDK console binding did not load from the shaded jar' }
      - name: Upload agent distribution
        uses: actions/upload-artifact@v4
        with:
          name: java-agent-windows-java11
          path: |
            target/java-agent.jar
            target/productivity.jar
            java-agent.cmd
            launch-java-agent.ps1
            install-user-path.ps1
          if-no-files-found: error
